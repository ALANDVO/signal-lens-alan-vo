[project]
name = "signal-lens-alan-vo"
version = "1.0.0"
description = "SignalLens: Layer-pipelined AirLLM inference profiling, layer batching scheduler, and diagnostic workbench"
authors = [
    { name = "Alan Vo", email = "alanvo@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
